<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rothello - Grandmaster Othello</title>
    <script>
      // When served on GitHub Pages from root, redirect to docs/ where bundled production build lives
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var base = window.location.pathname.replace(/\/?$/, '/');
        window.location.replace(base + 'docs/');
      }
    </script>
  </head>
  <body class="bg-lichess-bg text-[#d0d0d0] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
